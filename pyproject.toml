[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaol"
version = "0.2.0"
description = "Yet another observability library"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "opentelemetry-api>=1.36",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36",
    "opentelemetry-instrumentation-aiohttp-client>=0.57b0",
    "opentelemetry-instrumentation-asyncpg>=0.57b0",
    "opentelemetry-instrumentation-fastapi>=0.57b0",
    "opentelemetry-instrumentation-httpx>=0.57b0",
    "opentelemetry-instrumentation-redis>=0.57b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
    "opentelemetry-instrumentation-system-metrics>=0.57b0",
    "opentelemetry-sdk>=1.36",
    "pyroscope-io>=0.8.8",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.4",
]

[dependency-groups]
dev = [
    "aiohttp>=3.12",
    "aiosqlite>=0.21",
    "fastapi>=0.116",
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "redis>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yaol"]
