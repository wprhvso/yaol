    { name = "opentelemetry-exporter-otlp-proto-grpc" },
    { name = "opentelemetry-instrumentation-aiohttp-client" },
    { name = "opentelemetry-instrumentation-asyncpg" },
    { name = "opentelemetry-instrumentation-fastapi" },
    { name = "opentelemetry-instrumentation-httpx" },
    { name = "opentelemetry-instrumentation-redis" },
    { name = "opentelemetry-instrumentation-sqlalchemy" },
    { name = "opentelemetry-instrumentation-system-metrics" },
    { name = "opentelemetry-sdk" },
    { name = "pyroscope-io" },
    { name = "sqlalchemy", extra = ["asyncio"] },
    { name = "structlog" },
]

[package.dev-dependencies]
dev = [
    { name = "fastapi" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "opentelemetry-api", specifier = ">=1.36" },
    { name = "opentelemetry-exporter-otlp-proto-grpc", specifier = ">=1.36" },
    { name = "opentelemetry-instrumentation-aiohttp-client", specifier = ">=0.57b0" },
    { name = "opentelemetry-instrumentation-asyncpg", specifier = ">=0.57b0" },
    { name = "opentelemetry-instrumentation-fastapi", specifier = ">=0.57b0" },
    { name = "opentelemetry-instrumentation-httpx", specifier = ">=0.57b0" },
    { name = "opentelemetry-instrumentation-redis", specifier = ">=0.57b0" },
    { name = "opentelemetry-instrumentation-sqlalchemy", specifier = ">=0.57b0" },
    { name = "opentelemetry-instrumentation-system-metrics", specifier = ">=0.57b0" },
    { name = "opentelemetry-sdk", specifier = ">=1.36" },
    { name = "pyroscope-io", specifier = ">=0.8.8" },
    { name = "sqlalchemy", extras = ["asyncio"], specifier = ">=2.0" },
    { name = "structlog", specifier = ">=25.4" },
]

[package.metadata.requires-dev]
dev = [
    { name = "fastapi", specifier = ">=0.116" },
    { name = "pytest", specifier = ">=8.4" },
]
